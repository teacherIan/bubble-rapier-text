name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs `prepare`, which runs build:lib — so a broken library build fails here too.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The demo is the only in-repo consumer of the public API, so building it catches an API
      # regression that the unit tests can't see.
      - run: npm run build

      # Guard the thing that is easy to break and expensive to notice: the published entry points
      # must actually exist. `exports` points at dist/, so if build:lib silently stopped emitting,
      # every consumer would break on install while everything above still passed.
      - name: Verify published entry points exist
        run: |
          test -f dist/bubble-rapier-text.js || { echo "::error::dist bundle missing"; exit 1; }
          test -f dist/index.d.ts           || { echo "::error::dist types missing";  exit 1; }
          ! grep -q 'import\.meta\.env' dist/bubble-rapier-text.js \
            || { echo "::error::import.meta.env leaked into the bundle — breaks non-Vite consumers"; exit 1; }
